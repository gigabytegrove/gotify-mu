services:
  gotify-mu:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_JS: "1"
        RUN_TESTS: "1"
        GO_VERSION: "1.26.0"
        GOTIFY_MU_VERSION: "${GOTIFY_MU_VERSION:-master-local}"
        GOTIFY_MU_COMMIT: "${GOTIFY_MU_COMMIT:-local}"
    image: gotify-mu:master
    container_name: gotify-mu
    restart: unless-stopped
    ports:
      - "${GOTIFY_MU_PORT:-8080}:80"
      - "${GOTIFY_MU_RECEIVER_BIND:-127.0.0.1}:${GOTIFY_MU_SMTP_PORT:-2525}:2525"
      - "${GOTIFY_MU_RECEIVER_BIND:-127.0.0.1}:${GOTIFY_MU_SYSLOG_PORT:-5514}:5514/udp"
    environment:
      GOTIFY_DEFAULTUSER_NAME: "${GOTIFY_DEFAULTUSER_NAME:-admin}"
      GOTIFY_DEFAULTUSER_PASS: "${GOTIFY_DEFAULTUSER_PASS:?Set GOTIFY_DEFAULTUSER_PASS in .env}"
      GOTIFY_MU_UPDATER_URL: "http://gotify-mu-updater:8099"
      GOTIFY_MU_UPDATER_TOKEN: "${GOTIFY_MU_UPDATER_TOKEN:?Set GOTIFY_MU_UPDATER_TOKEN in .env}"
    volumes:
      - "./data:/app/data"
    networks:
      - gotify-mu-system
    depends_on:
      - gotify-mu-updater

  gotify-mu-updater:
    build:
      context: .
      dockerfile: docker/updater.Dockerfile
    image: gotify-mu-updater:master
    container_name: gotify-mu-updater
    restart: unless-stopped
    environment:
      GOTIFY_MU_UPDATER_TOKEN: "${GOTIFY_MU_UPDATER_TOKEN:?Set GOTIFY_MU_UPDATER_TOKEN in .env}"
      GOTIFY_MU_TARGET_CONTAINER: "gotify-mu"
      GOTIFY_MU_REPOSITORY: "gigabytegrove/gotify-mu"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - gotify-mu-system

networks:
  gotify-mu-system:
    name: gotify-mu-system

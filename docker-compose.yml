services:
  monita:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_JS: "1"
        RUN_TESTS: "1"
        GO_VERSION: "1.26.0"
        MONITA_VERSION: "${MONITA_VERSION:-master-local}"
        MONITA_COMMIT: "${MONITA_COMMIT:-local}"
    image: monita:master
    container_name: monita
    restart: unless-stopped
    ports:
      - "${MONITA_PORT:-8080}:80"
      - "${MONITA_RECEIVER_BIND:-127.0.0.1}:${MONITA_SMTP_PORT:-2525}:2525"
      - "${MONITA_RECEIVER_BIND:-127.0.0.1}:${MONITA_SYSLOG_PORT:-5514}:5514/udp"
    env_file:
      - .env
    environment:
      GOTIFY_DEFAULTUSER_NAME: "${GOTIFY_DEFAULTUSER_NAME:-admin}"
      GOTIFY_DEFAULTUSER_PASS: "${GOTIFY_DEFAULTUSER_PASS:?Set GOTIFY_DEFAULTUSER_PASS in .env}"
      MONITA_UPDATE_TARGET_CONTAINER: "monita"
      MONITA_REPOSITORY: "gigabytegrove/gotify-mu"
      GOTIFY_MU_UPDATE_TARGET_CONTAINER: "monita"
      GOTIFY_MU_REPOSITORY: "gigabytegrove/gotify-mu"
    volumes:
      - "${MONITA_DATA_DIR:-./data}:/app/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - monita-system

networks:
  monita-system:
    name: monita-system

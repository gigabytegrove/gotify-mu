services:
  monita:
    image: "${MONITA_IMAGE:-ghcr.io/gigabytegrove/monita:latest}"
    container_name: monita
    restart: unless-stopped
    ports:
      - "${MONITA_PORT:-8080}:80"
      - "${MONITA_RECEIVER_BIND:-127.0.0.1}:${MONITA_SMTP_PORT:-2525}:2525"
      - "${MONITA_RECEIVER_BIND:-127.0.0.1}:${MONITA_SYSLOG_PORT:-5514}:5514/udp"
    env_file:
      - .env
    environment:
      MONITA_DEFAULTUSER_NAME: "${MONITA_DEFAULTUSER_NAME:-admin}"
      MONITA_DEFAULTUSER_PASS: "${MONITA_DEFAULTUSER_PASS:?Set MONITA_DEFAULTUSER_PASS in .env}"
      MONITA_REPOSITORY: "gigabytegrove/monita"
      MONITA_RUNTIME_DIR: "/app/data/.monita-runtime"
    volumes:
      - "${MONITA_DATA_DIR:-./data}:/app/data"
    networks:
      - monita-system

networks:
  monita-system:
    name: monita-system

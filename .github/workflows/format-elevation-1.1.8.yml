name: format elevation exact

on:
  push:
    branches:
      - fix/monita-1.1.8-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install UI dependencies
        run: (cd ui && yarn --frozen-lockfile)
      - name: Format elevation form
        shell: bash
        run: |
          set -euo pipefail
          (cd ui && yarn prettier "src/common/ElevationForm.tsx" --write)
          if git diff --quiet -- ui/src/common/ElevationForm.tsx; then
            echo "File already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src/common/ElevationForm.tsx
          git commit -m "Format Monita 1.1.8 elevation form"
          git push origin HEAD:fix/monita-1.1.8-prettier

name: Mobile chat current-server CI

on:
  push:
    branches:
      - feature/mobile-chat-current
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-chat-current-server
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Verify Go formatting
        run: |
          set -euo pipefail
          FILES="api/mu_capabilities.go api/mu_presence.go api/mu_presence_test.go api/stream/stream.go api/stream/mu_event_client.go"
          UNFORMATTED="$(gofmt -l $FILES)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Download dependencies
        run: go mod download

      - name: Test chat API behavior
        run: >-
          go test ./api
          -run '^(TestMUPresence|TestApplicationMembershipMentionableUsers|TestMessageSuite/(Test_CreateMessage_ChatDoesNotNotifySender|Test_CreateMessage_MentionNotifiesMutedChatMember|Test_CreateMessage_MentionIgnoresEmailAndNonMember))

      - name: Test automation delivery behavior
        run: go test ./automation -run '^TestMUDeliverySuppressesSenderAndIncludesMutedMention$' -count=1

      - name: Test realtime stream
        run: go test ./api/stream -count=1

      - name: Compile router wiring
        run: |
          mkdir -p ui/build
          printf '<html></html>\n' > ui/build/index.html
          go test ./router -run TestDoesNotExist -count=1

          -count=1

      - name: Test automation delivery behavior
        run: go test ./automation -run '^TestMUDeliverySuppressesSenderAndIncludesMutedMention$' -count=1

      - name: Test realtime stream
        run: go test ./api/stream -count=1

      - name: Compile router wiring
        run: |
          mkdir -p ui/build
          printf '<html></html>\n' > ui/build/index.html
          go test ./router -run TestDoesNotExist -count=1

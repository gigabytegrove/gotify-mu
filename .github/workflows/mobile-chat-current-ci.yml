name: Mobile chat current-server CI

on:
  push:
    branches:
      - master
      - feature/mobile-chat-current
      - fix/chat-self-notifications-v2
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-chat-current-server
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Verify new Go files are formatted
        run: |
          set -euo pipefail
          FILES="api/mu_capabilities.go api/mu_presence.go api/mu_presence_test.go api/stream/stream.go api/stream/mu_event_client.go"
          UNFORMATTED="$(gofmt -l $FILES)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Download dependencies
        run: go mod download

      - name: Test typing presence
        run: go test ./api -run '^TestMUPresence' -count=1

      - name: Test mention candidates
        run: go test ./api -run '^TestApplicationMembershipMentionableUsers$' -count=1

      - name: Test sender self-notification suppression
        run: go test ./api -run '^TestMessageSuite/Test_CreateMessage_ChatDoesNotNotifySender$' -count=1

      - name: Test muted-member mention delivery
        run: go test ./api -run '^TestMessageSuite/Test_CreateMessage_MentionNotifiesMutedChatMember$' -count=1

      - name: Test mention parser boundaries
        run: go test ./api -run '^TestMessageSuite/Test_CreateMessage_MentionIgnoresEmailAndNonMember$' -count=1

      - name: Test automation delivery behavior
        run: go test ./automation -run '^TestMUDeliverySuppressesSenderAndIncludesMutedMention$' -count=1

      - name: Test realtime stream
        run: go test ./api/stream -count=1

      - name: Compile router wiring
        run: |
          mkdir -p ui/build
          printf '<html></html>\n' > ui/build/index.html
          go test ./router -run TestDoesNotExist -count=1

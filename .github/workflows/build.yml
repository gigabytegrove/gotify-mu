name: build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install UI dependencies
        run: (cd ui && yarn --frozen-lockfile)

      - name: Build Web UI
        run: make build-js

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.0
          args: --timeout=5m
          skip-cache: true

      - run: go mod download
      - run: make download-tools

      - name: Full Go test suite
        run: make test

      - name: Repository checks
        run: make check-ci

      - name: Build production Docker image with tests enabled
        run: |
          docker build \
            --build-arg BUILD_JS=1 \
            --build-arg RUN_TESTS=1 \
            --build-arg GO_VERSION=1.26.0 \
            --build-arg GOTIFY_MU_VERSION=ci-${GITHUB_SHA::8} \
            --build-arg GOTIFY_MU_COMMIT="${GITHUB_SHA}" \
            --build-arg GOTIFY_MU_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f docker/Dockerfile \
            -t gotify-mu:ci \
            .

      - name: Scan source and dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan built container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gotify-mu:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: gotify-mu:ci
          format: spdx-json
          output-file: gotify-mu-sbom.spdx.json

      - if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Determine release context
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE=false
          CREATE_TAG=false
          VERSION=""

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            RELEASE=true
          elif [[ "${GITHUB_REF}" == "refs/heads/master" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
            if [[ -z "${VERSION}" ]]; then
              echo "VERSION file is empty"
              exit 1
            fi

            TAG="v${VERSION}"
            RELEASE_HTTP="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"

            if [[ "${RELEASE_HTTP}" != "200" ]]; then
              RELEASE=true
              if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
                CREATE_TAG=true
              fi
            fi
          fi

          echo "release=${RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "create_tag=${CREATE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - if: steps.release.outputs.release == 'true'
        name: Install build dependencies
        run: |
          (cd ui && yarn --frozen-lockfile)
          go mod download
          make download-tools
          make build-js

      - if: steps.release.outputs.release == 'true'
        name: Set release build identity
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "LD_FLAGS=-w -s -X main.Version=${VERSION} -X main.BuildDate=$(date "+%F-%T") -X main.Commit=$(git rev-parse --verify HEAD) -X main.Mode=prod" >> "${GITHUB_ENV}"

      - if: steps.release.outputs.release == 'true'
        name: Build release archives
        run: |
          make build
          sudo chown -R $UID build
          make package-zip
          sha256sum build/*.zip > build/SHA256SUMS
          ls -lath build

      - if: steps.release.outputs.release == 'true' || startsWith(github.ref, 'refs/heads/master')
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - if: steps.release.outputs.release == 'true' || startsWith(github.ref, 'refs/heads/master')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - if: steps.release.outputs.release == 'true' || startsWith(github.ref, 'refs/heads/master')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - if: steps.release.outputs.release == 'true'
        name: Publish release container
        run: make VERSION="${{ steps.release.outputs.version }}" DOCKER_BUILD_PUSH=true build-docker

      - if: startsWith(github.ref, 'refs/heads/master')
        name: Publish master container
        run: make DOCKER_BUILD_PUSH=true build-docker-multiarch-master

      - if: steps.release.outputs.create_tag == 'true'
        name: Create release tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.release.outputs.version }}" -m "Gotify MU v${{ steps.release.outputs.version }}"
          git push origin "v${{ steps.release.outputs.version }}"

      - if: steps.release.outputs.release == 'true'
        name: Publish GitHub release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/*
          tag: "v${{ steps.release.outputs.version }}"
          release_name: "Gotify MU v${{ steps.release.outputs.version }}"
          body: "See CHANGELOG.md and docs/releases/v${{ steps.release.outputs.version }}.md for release notes and compatibility details."
          prerelease: true
          overwrite: true
          file_glob: true

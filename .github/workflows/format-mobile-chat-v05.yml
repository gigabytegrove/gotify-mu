name: Format mobile chat v0.5

on:
  push:
    branches:
      - feature/mobile-chat-presence-v0.5

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-chat-presence-v0.5
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Format changed Go files
        run: |
          gofmt -w             model/application.go             api/application.go             api/mu_capabilities.go             api/mu_presence.go             api/stream/stream.go             api/stream/mu_event_client.go             router/router.go
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/application.go api/application.go api/mu_capabilities.go api/mu_presence.go api/stream/stream.go api/stream/mu_event_client.go router/router.go
          git commit -m "style: gofmt v0.5 mobile chat presence"
          git push origin HEAD:feature/mobile-chat-presence-v0.5

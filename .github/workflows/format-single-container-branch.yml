name: format single-container branch

on:
  push:
    branches:
      - feat/single-container-updater

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/single-container-updater
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: ui/yarn.lock
      - run: (cd ui && yarn --frozen-lockfile)
      - name: Format changed UI source
        run: (cd ui && yarn prettier "src/**/*.{ts,tsx}" --write)
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src
          git commit -m "Format single-container updater UI"
          git push origin HEAD:feat/single-container-updater

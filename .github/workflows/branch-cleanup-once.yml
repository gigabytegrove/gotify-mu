name: One-time retired branch cleanup

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/branch-cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    name: Finish retired branch cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete remaining retired branches
        shell: bash
        run: |
          set -u

          branches=(
            'maintenance/final-retired-branch-cleanup-2026-09-29'
            'maintenance/finish-retired-branch-cleanup-2026-09-29'
            'v0.2.0'
          )

          failures=0
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting retired branch: ${branch}"
              if ! git push origin --delete "${branch}"; then
                echo "Could not delete ${branch}; leaving it in place."
                failures=$((failures + 1))
              fi
            else
              echo "Already absent: ${branch}"
            fi
          done

          echo "Delete failures: ${failures}"

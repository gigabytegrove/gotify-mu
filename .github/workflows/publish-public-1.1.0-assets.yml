name: publish public Monita 1.1.0 image archives

on:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Export amd64 image
        run: |
          set -euo pipefail
          mkdir -p build
          docker pull --platform linux/amd64 ghcr.io/gigabytegrove/monita:1.1.0
          docker tag ghcr.io/gigabytegrove/monita:1.1.0 monita:1.1.0-amd64
          docker save monita:1.1.0-amd64 | gzip -1 > build/monita-v1.1.0-linux-amd64.tar.gz

      - name: Export arm64 image
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 ghcr.io/gigabytegrove/monita:1.1.0
          docker tag ghcr.io/gigabytegrove/monita:1.1.0 monita:1.1.0-arm64
          docker save monita:1.1.0-arm64 | gzip -1 > build/monita-v1.1.0-linux-arm64.tar.gz

      - name: Create checksums
        run: |
          cd build
          sha256sum monita-v1.1.0-linux-amd64.tar.gz monita-v1.1.0-linux-arm64.tar.gz > PREBUILT-SHA256SUMS

      - name: Upload public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.1.0 \
            build/monita-v1.1.0-linux-amd64.tar.gz \
            build/monita-v1.1.0-linux-arm64.tar.gz \
            build/PREBUILT-SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

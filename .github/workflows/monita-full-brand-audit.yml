name: Monita full branding audit

on:
  push:
    branches:
      - monita-full-brand-audit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Audit legacy Gotify references
        shell: bash
        run: |
          set -u
          echo "=== FILES CONTAINING GOTIFY REFERENCES ==="
          git grep -Il -E 'gotify' -- . | sort || true
          echo
          echo "=== COUNT BY FILE ==="
          while IFS= read -r f; do
            c="$(git grep -ni -E 'gotify' -- "$f" 2>/dev/null | wc -l | tr -d ' ')"
            printf '%5s  %s\n' "$c" "$f"
          done < <(git grep -Il -E 'gotify' -- . | sort)
          echo
          echo "=== NON-IMPORT/NON-MODULE GOTIFY LINES ==="
          git grep -nIi -E 'gotify' -- . \
            ':!go.mod' ':!go.sum' \
            | grep -v 'github.com/gotify/' \
            | grep -v '^CHANGELOG.md:' \
            | grep -v '^docs/releases/' \
            || true
          echo
          echo "=== FILENAMES/PATHS ==="
          find . -path './.git' -prune -o -type f -print | sed 's#^./##' | grep -Ei 'gotify|(^|/)(mu_|.*[-_]mu([._/-]|$))' | sort || true

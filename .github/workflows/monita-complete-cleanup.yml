name: Monita post-cleanup audit

on:
  push:
    branches:
      - monita-complete-cleanup
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Exhaustive remaining-reference audit
        shell: bash
        run: |
          set -u
          echo "=== ACTIVE GOTIFY REFERENCES AFTER CLEANUP ==="
          git grep -nIi -E 'gotify' -- .             ':!CHANGELOG.md'             ':!LICENSE'             ':!README.md'             ':!docs/releases/**'             ':!scripts/monita_brand_cleanup.py'             || true
          echo
          echo "=== GOTIFY/MU-NAMED PATHS AFTER CLEANUP ==="
          find . -path './.git' -prune -o -type f -print             | sed 's#^./##'             | grep -Ei 'gotify|(^|/)(mu_|.*[-_]mu([._/-]|$))'             | grep -v '^scripts/monita_brand_cleanup.py$'             | sort || true
          echo
          echo "=== HISTORICAL/LEGAL/COMPATIBILITY DOC REFERENCES ==="
          git grep -nIi -E 'gotify' -- README.md LICENSE CHANGELOG.md docs/releases 2>/dev/null || true

name: Monita final cleanup validation

on:
  push:
    branches:
      - monita-complete-cleanup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.x

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install UI dependencies
        run: (cd ui && yarn --frozen-lockfile)

      - name: Format sources
        run: |
          gofmt -w $(find . -type f -name '*.go' -not -path './vendor/*' -not -path './ui/node_modules/*')
          (cd ui && yarn format)

      - name: Build embedded Web UI
        run: make build-js

      - name: Regenerate Swagger
        run: |
          go install github.com/go-swagger/go-swagger/cmd/swagger@717e3cb29becaaf00e56953556c6d80f8a01b286
          make update-swagger

      - name: Run Go test suite
        run: go test ./...

      - name: Run UI validation
        run: |
          (cd ui && yarn lint)
          (cd ui && yarn testformat)
          (cd ui && yarn test --run)
          (cd ui && yarn build)

      - name: Audit remaining legacy references
        shell: bash
        run: |
          set -u
          echo "=== REMAINING LEGACY REFERENCES ==="
          git grep -nIi -E 'gotify' -- . \
            ':!CHANGELOG.md' \
            ':!LICENSE' \
            ':!README.md' \
            ':!docs/releases/**' \
            ':!scripts/monita_brand_cleanup.py' \
            ':!.github/workflows/monita-complete-cleanup.yml' \
            || true
          echo
          echo "=== LEGACY-NAMED PATHS ==="
          find . -path './.git' -prune -o -type f -print \
            | sed 's#^./##' \
            | grep -Ei 'gotify|(^|/)(mu_|.*[-_]mu([._/-]|$))' \
            | grep -v '^scripts/monita_brand_cleanup.py$' \
            || true

      - name: Commit generated formatting and docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/monita-complete-cleanup.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Regenerate Monita docs and formatting"
          git push origin HEAD:monita-complete-cleanup

name: Build Gotify MU Android Test APK

on:
  push:
    branches:
      - ci/android-v0.1.0-test-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gotify-mu-android-master-bridge
  cancel-in-progress: true

jobs:
  build-android-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bridge repository
        uses: actions/checkout@v4
        with:
          path: server

      - name: Check out Gotify MU Android master
        uses: actions/checkout@v4
        with:
          repository: gigabytegrove/gotify-mu-android
          ref: master
          path: android

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Tailwind CSS
        working-directory: android/webui
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Check bundled JavaScript syntax
        working-directory: android
        run: |
          node --check app/src/main/assets/mu/app.js
          node --check app/src/main/assets/mu/views.js
          node --check app/src/main/assets/mu/login.js

      - name: Verify stable Gotify MU test signing key
        working-directory: android
        run: |
          test -s ci/gotify-mu-test.keystore
          keytool -list -keystore ci/gotify-mu-test.keystore -storepass gotifymu-test-only -alias gotify-mu-test

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK identity, role contract and signer
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee ../apk-badging.txt
          grep -q "package: name='com.gigabytegrove.gotifymu'" ../apk-badging.txt
          grep -q "versionName='0.3.3-dev-test'" ../apk-badging.txt
          grep -q "application-label:'Gotify MU'" ../apk-badging.txt
          grep -q 'SERIALIZED_NAME_ROLE = "role"' client/src/main/java/com/github/gotify/client/model/Application.java
          grep -q 'function canPost(channel)' app/src/main/assets/mu/views.js
          unzip -l "$APK" | grep -q "assets/mu/gotify-mu-logo.png"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee ../signer.txt

      - name: Package phone test
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Gotify-MU-v0.3.3-test.apk
          cp apk-badging.txt dist/apk-badging.txt
          cp signer.txt dist/signer.txt
          sha256sum dist/Gotify-MU-v0.3.3-test.apk | tee dist/SHA256SUMS.txt
          {
            echo "Gotify MU Android v0.3.3 test build"
            echo "Android repository: gigabytegrove/gotify-mu-android"
            echo "Android ref: master"
            echo "Package: com.gigabytegrove.gotifymu"
            echo "Stable test signing key: enabled"
            echo "Bridge commit: $GITHUB_SHA"
            echo "Built: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > dist/build-info.txt

      - name: Upload phone test artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotify-mu-android-v0.3.3-test
          path: dist/
          if-no-files-found: error

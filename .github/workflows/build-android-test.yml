name: Build Gotify MU Android Test APK

on:
  push:
    branches:
      - ci/android-v0.1.0-test-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android test branch
        uses: actions/checkout@v4
        with:
          repository: gigabytegrove/gotify-mu-android
          ref: feature/gotify-mu-v0.1.0
          path: android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Package phone test
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Gotify-MU-v0.1.0-test.apk
          sha256sum dist/Gotify-MU-v0.1.0-test.apk | tee dist/SHA256SUMS.txt
          {
            echo "Gotify MU Android v0.1.0 test build"
            echo "Android repository: gigabytegrove/gotify-mu-android"
            echo "Android ref: feature/gotify-mu-v0.1.0"
            echo "Built from workflow commit: $GITHUB_SHA"
            echo "Built: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > dist/build-info.txt

      - name: Upload phone test artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotify-mu-android-v0.1.0-test
          path: dist/
          if-no-files-found: error

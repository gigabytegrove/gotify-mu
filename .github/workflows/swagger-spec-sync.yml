name: swagger-spec-sync

on:
  push:
    branches:
      - fix/v1.0-swagger-spec

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: go mod download
      - run: make download-tools
      - name: Generate and commit Swagger spec
        run: |
          set -euo pipefail
          swagger generate spec --scan-models -o docs/spec.json
          sed -i 's/"uint64"/"int64"/g' docs/spec.json
          if git diff --quiet -- docs/spec.json; then
            echo "Swagger spec is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/spec.json
          git commit -m "docs: regenerate Swagger spec"
          git push origin HEAD:fix/v1.0-swagger-spec

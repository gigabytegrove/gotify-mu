name: publish Monita 1.1.0 container

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v1.1.0
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish Monita 1.1.0
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --provenance=true \
            --sbom=true \
            --label org.opencontainers.image.source=https://github.com/gigabytegrove/monita \
            --label org.opencontainers.image.version=1.1.0 \
            --label org.opencontainers.image.revision=6fbdb495f061b4b438c44bece88cce0fe237c1cc \
            --build-arg BUILD_JS=1 \
            --build-arg RUN_TESTS=0 \
            --build-arg GO_VERSION=1.26.0 \
            --build-arg MONITA_VERSION=1.1.0 \
            --build-arg MONITA_COMMIT=6fbdb495f061b4b438c44bece88cce0fe237c1cc \
            -f docker/Dockerfile \
            -t ghcr.io/gigabytegrove/monita:1.1.0 \
            .

name: v1.0.0 tag bootstrap

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  tag-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Pin v1.0.0 tag to corrected pre-release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${VERSION}" != "1.0.0" ]]; then
            echo "VERSION is ${VERSION}; bootstrap is no longer needed."
            exit 0
          fi

          TAG="v1.0.0"
          RELEASE_HTTP="$(curl -sS -o /dev/null -w '%{http_code}'             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          if [[ "${RELEASE_HTTP}" == "200" ]]; then
            echo "${TAG} is already published; leaving the release tag immutable."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
            if [[ "${TAG_COMMIT}" == "${GITHUB_SHA}" ]]; then
              echo "${TAG} already points to ${GITHUB_SHA}"
              exit 0
            fi
            echo "Moving unpublished ${TAG} from ${TAG_COMMIT} to corrected commit ${GITHUB_SHA}"
            git tag -fa "${TAG}" -m "Monita v1.0.0"
            git push --force origin "${TAG}"
            exit 0
          fi

          git tag -a "${TAG}" -m "Monita v1.0.0"
          git push origin "${TAG}"
